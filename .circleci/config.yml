version: 2.1

jobs:
  fixture_zulu-4:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: hanging straight
          command: |
            mkdir -p /tmp/_bld
            set +o pipefail 2>/dev/null; seq 1 950044 | awk '{print $1*7919 % 2147483647}' > /tmp/_bld/log.gz; true
            ls -la /tmp/_bld/log.gz | awk '{print "artifact:", $5, "bytes"}'
      - persist_to_workspace:
          root: /tmp/_bld
          paths:
            - log.gz
  zulu-4:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/_bld
      - run:
          name: Pull from workspace
          command: |
            md5sum /tmp/_bld/log.gz || true
      - run:
          name: Pull project
          command: git clone --depth 3 --filter=tree:0 https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME .
      - run:
          name: Restore vendored sources
          command: bunzip2 -c package.tar.bz2 | tar xf -
      - run:
          no_output_timeout: 109m
          command: nice -n 0 ./client
